[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# FAST = FastAPI-specific rules (Annotated usage, redundant response_model, ...)
select = ["E", "F", "I", "UP", "B", "FAST"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
